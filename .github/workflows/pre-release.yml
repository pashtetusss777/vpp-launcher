name: Pre-Release

on:
  push:
    tags:
      - "v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the pre-release, for example v1.1.11-beta.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    if: >-
      (github.event_name == 'push' && contains(github.ref_name, '-'))
      || (github.event_name == 'workflow_dispatch' && contains(inputs.tag, '-'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot libarchive-tools
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist-release/*.exe
            dist-release/*.zip
            dist-release/*.pkg
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.pacman
            dist-release/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release files"
            exit 1
          fi
          ls -lh artifacts
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          gh release create "$TAG" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Vanilla++ ${TAG#v}" \
            --notes "Пре-релиз. Windows (установщик и portable zip), macOS (.pkg и zip), Linux x64 и arm64 (AppImage, deb, pacman, tar.gz)."
